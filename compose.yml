# rust-crypto-orderbook as a container:
#
#     docker compose up --build
#     docker compose run --rm app --pair btcusd --port 12345
#
# The gRPC server (landed in 004-grpc-server) keeps the container running —
# it does not log a line and exit. `docker compose up` stays attached to a
# live process serving gRPC on the published port below, alongside the
# Binance feed and (for now, until step 3 wires the real aggregator) the
# fake-data writer.

services:
  app:
    build: .
    image: rust-crypto-orderbook:local
    container_name: rust-crypto-orderbook # stable handle for host `docker` commands

    env_file:
      - path: .env
        required: false

    environment:
      ORDERBOOK_LOG_LEVEL: ${ORDERBOOK_LOG_LEVEL:-info}
      # 127.0.0.1 inside the container is the container's own loopback, not
      # the host's — binding there would make the published port below
      # refuse every connection while the container's own logs look
      # perfectly healthy. See Config::host's doc comment (src/config.rs).
      ORDERBOOK_HOST: 0.0.0.0
      # Binance isn't reachable directly from some networks. If PROXY_HOST/
      # PROXY_PORT are set in .env, the app tunnels its Binance connection
      # through an HTTP CONNECT proxy at that address. `:+` is compose's
      # "substitute only if set and non-empty" form (unlike `:-`, which
      # always substitutes something) — left unset (the default), these
      # resolve to an empty string rather than a broken `http://:` value;
      # the app treats an empty env var the same as an absent one.
      HTTP_PROXY: ${PROXY_HOST:+http://${PROXY_HOST}:${PROXY_PORT}}
      HTTPS_PROXY: ${PROXY_HOST:+http://${PROXY_HOST}:${PROXY_PORT}}

    # Host-loopback only, matching this project's posture of not exposing
    # anything beyond the local machine — never 0.0.0.0:50051:50051.
    ports:
      - "127.0.0.1:50051:50051"

    # Compose's default project network: nothing external to create first,
    # so the repo runs with no manual setup.

    # Expected, not a defect: on a network the container can't reach Binance
    # from (directly or via the PROXY_HOST/PROXY_PORT pass-through above),
    # the container exits shortly after starting — the three-task select!
    # in main.rs ends the whole process the instant the feed task ends.
