# keyrock-case-study as a container:
#
#     docker compose up --build
#     docker compose run --rm app --pair btcusd --port 12345
#
# No long-running service yet, so nothing to `up -d`, publish, or healthcheck.

services:
  app:
    build: .
    image: keyrock-case-study:local
    container_name: keyrock-case-study # stable handle for host `docker` commands

    env_file:
      - path: .env
        required: false

    environment:
      KEYROCK_LOG_LEVEL: ${KEYROCK_LOG_LEVEL:-info}

    # Compose's default project network: nothing external to create first,
    # so the repo runs with no manual setup.

    # When a server lands: publish on loopback only and set KEYROCK_HOST=0.0.0.0.
