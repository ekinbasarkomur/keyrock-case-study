[package]
name = "keyrock-case-study"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
prost = "0.14.4"
# 0.10 is recent — most examples online are still on 0.8/0.9 syntax and won't
# compile. Check docs.rs for this version when jitter lands at step 6.
rand = "0.10.2"
# Not one of the crates listed in step 0's Tooling table — pulled in here as
# a direct dependency only because rustls 0.23+ no longer installs a default
# `CryptoProvider` implicitly from a Cargo feature; the app must call
# `install_default()` once before the first TLS connection, which needs this
# import. `tokio-tungstenite`'s `rustls-tls-webpki-roots` feature already
# resolves `rustls` transitively with the `ring` provider (confirmed via
# `Cargo.lock`); this just names the same already-resolved crate/feature
# directly so `src/main.rs` can call into it. Discovered empirically in
# Phase 3 when the live connection panicked at startup — see
# `specs/002-binance-feed/`.
#
# `tls12` added in 006-bitstamp: this entry's `default-features = false`
# meant TLS1.2 support was compiled out crate-wide, so this binary could
# only ever offer TLS1.3 in its ClientHello. Binance's endpoint happens to
# accept TLS1.3, which hid the gap — Bitstamp's frontend doesn't, and drops
# a TLS1.3-only handshake outright (confirmed via `openssl s_client -tls1_3`
# reproducing the same drop against the same host). See
# `specs/006-bitstamp/spec.md` for where this surfaced.
#
# `tls12` because Bitstamp's frontend refuses a TLS1.3-only handshake —
# without it the connection dies at the handshake with an EOF. Invisible
# until step 4 because Binance accepts TLS1.3.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Moved from [dev-dependencies] in 011-measurement: now backs production
# latency instrumentation in src/aggregator.rs (parse/merge+publish/total
# histograms), not just a bench — dev-dependencies aren't reachable from the
# shipped binary.
hdrhistogram = "7.6.0"

[build-dependencies]
tonic-prost-build = "0.14.6"

[profile.release]
strip = true
# lto/codegen-units added and measured in 011-measurement (see
# specs/011-measurement/): before/after build time and p50 both recorded
# in README.md's Measurement section, not assumed to help. panic = "abort"
# is deliberately not added — it would collapse JoinError::is_panic()'s
# panic-vs-cancellation distinction the JoinSet supervisor in src/main.rs
# depends on.
lto = "fat"
codegen-units = 1
