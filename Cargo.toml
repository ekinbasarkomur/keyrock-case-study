[package]
name = "rust-crypto-orderbook"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
prost = "0.14.4"
# 0.10 is recent — most examples online are still on 0.8/0.9 syntax and won't
# compile. Check docs.rs for this version when jitter lands at step 6.
rand = "0.10.2"
# Not one of the crates listed in step 0's Tooling table — pulled in here as
# a direct dependency only because rustls 0.23+ no longer installs a default
# `CryptoProvider` implicitly from a Cargo feature; the app must call
# `install_default()` once before the first TLS connection, which needs this
# import. `tokio-tungstenite`'s `rustls-tls-webpki-roots` feature already
# resolves `rustls` transitively with the `ring` provider (confirmed via
# `Cargo.lock`); this just names the same already-resolved crate/feature
# directly so `src/main.rs` can call into it. Discovered empirically in
# Phase 3 when the live connection panicked at startup — see
# `specs/002-binance-feed/`.
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
# Dev-only for now, but not permanently: step 8's latency instrumentation
# will live in the running service (numbers from real feeds, not synthetic
# input), not in a bench. When that lands, this moves to [dependencies] —
# dev-dependencies aren't reachable from the shipped binary.
hdrhistogram = "7.6.0"

[profile.release]
strip = true
